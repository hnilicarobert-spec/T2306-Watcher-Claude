name: Scan for chair

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs somewhat during
    # busy periods — that's normal and free-tier expected behavior.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
    # ^ This is the "push a search from my iPhone" button: open this repo's
    # Actions tab → "Scan for chair" → Run workflow. Works from mobile Safari
    # or the GitHub mobile app, no computer needed.

permissions:
  contents: write   # needed so the workflow can commit updated results back to the repo
  pages: write
  id-token: write

concurrency:
  group: chair-watcher-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip and model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/clip
            ~/.cache/torch
            ~/.cache/ms-playwright
          key: chair-watcher-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            chair-watcher-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's browser
        run: playwright install --with-deps chromium

      - name: Restore Facebook session (optional)
        if: ${{ secrets.FACEBOOK_SESSION_B64 != '' }}
        run: echo "${{ secrets.FACEBOOK_SESSION_B64 }}" | base64 -d > facebook_session.json
        # This keeps your Facebook login session out of the public repo entirely —
        # it only ever exists as an encrypted GitHub secret and a temporary file
        # on the runner, which is deleted when the job finishes. See README.md's
        # "Facebook Marketplace" section for how to create this secret.

      - name: Run the scan and build the results page
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FACEBOOK_SESSION_PATH: ${{ secrets.FACEBOOK_SESSION_B64 != '' && 'facebook_session.json' || '' }}
        run: python3 build_report.py

      - name: Commit updated results
        run: |
          git config user.name "chair-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add found_listings.json seen.json docs/index.html
          git diff --quiet --cached || git commit -m "Update scan results [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
