name: Scan for chair

on:
  schedule:
    # Hourly. This native GitHub schedule trigger is kept as a BACKUP —
    # GitHub's own docs call scheduled triggers "best-effort, not
    # guaranteed," and in practice (confirmed via current GitHub Community
    # reports) frequent schedules on public repos can be delayed by hours
    # or dropped entirely, especially during platform load. That's almost
    # certainly why "every 30 minutes" was actually landing every ~3 hours.
    # The RELIABLE trigger is an external cron service calling the GitHub
    # API's workflow_dispatch endpoint directly — see SETUP.md's "Reliable
    # hourly scheduling" section. This native schedule just fires as a
    # free second attempt on top of that, in case the external one ever
    # misses.
    - cron: "0 * * * *"
  workflow_dispatch: {}
    # ^ This is the "push a search from my iPhone" button: open this repo's
    # Actions tab → "Scan for chair" → Run workflow. Works from mobile Safari
    # or the GitHub mobile app, no computer needed. Also what the external
    # cron-job.org trigger below calls, via the GitHub API.

permissions:
  contents: write   # needed so the workflow can commit updated results back to the repo
  pages: write
  id-token: write

concurrency:
  group: chair-watcher-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions doesn't allow the `secrets` context directly inside
      # an `if:` condition — only in `env:`/`run:`. So the secret is copied
      # into a job-level env var here once, and steps below check that
      # instead of `secrets.FACEBOOK_SESSION_B64` directly.
      FACEBOOK_SESSION_B64: ${{ secrets.FACEBOOK_SESSION_B64 }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip and model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/clip
            ~/.cache/torch
            ~/.cache/ms-playwright
          key: chair-watcher-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            chair-watcher-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's browser
        run: playwright install --with-deps chromium

      - name: Restore Facebook session (optional)
        if: ${{ env.FACEBOOK_SESSION_B64 != '' }}
        run: echo "$FACEBOOK_SESSION_B64" | base64 -d > facebook_session.json
        # This keeps your Facebook login session out of the public repo entirely —
        # it only ever exists as an encrypted GitHub secret and a temporary file
        # on the runner, which is deleted when the job finishes. See README.md's
        # "Facebook Marketplace" section for how to create this secret.

      - name: Run the scan and build the results page
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional free search APIs (no credit card) — see SETUP.md
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FACEBOOK_SESSION_PATH: ${{ env.FACEBOOK_SESSION_B64 != '' && 'facebook_session.json' || '' }}
        run: python3 build_report.py

      - name: Commit updated results
        run: |
          git config user.name "chair-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add found_listings.json seen.json docs/index.html
          git add source_status.json api_usage.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Update scan results [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
